name: AppSec - admin_move_player isolated PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/appsec/**'
      - 'supabase/migrations/20261016230000_appsec_revoke_anon_admin_move_player.sql'
      - '.github/workflows/appsec-admin-move-player.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsec-admin-move-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-permission-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: gbr_appsec_ci
          POSTGRES_PASSWORD: ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gbr_appsec_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: gbr_appsec_ci
      PGPASSWORD: ci_fixture_only
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Run isolated authorization and rollback tests
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/appsec/admin-move-player.integration.sql
