name: Assemble GBR 5.5.10C Worker
on:
  push:
    branches:
      - sync/gbr-5.5.10c-20261017
    paths:
      - '.gbr-sync/worker-5.5.10c/**'
      - '.github/workflows/assemble-worker-5510c.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore exact approved Worker
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib
          from pathlib import Path
          root = Path('.gbr-sync/worker-5.5.10c')
          chunks = sorted(root.glob('chunk-*.b64'))
          if len(chunks) != 28:
              raise SystemExit(f'Expected 28 chunks; got {len(chunks)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          payload = base64.b64decode(encoded, validate=True)
          expected = 'c7062022fe8d3631d39fad10682292093de18b52b3ec336e49765ed920329df8'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Worker SHA256 mismatch: {actual}')
          Path('_worker.js').write_bytes(payload)
          print(f'Worker verified: {len(payload)} bytes, SHA256 {actual}')
          PYCODE
      - name: Commit restored Worker on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _worker.js
          if git diff --cached --quiet; then
            echo 'Worker already matches the approved artifact.'
            exit 0
          fi
          git commit -m 'build: restore exact 5.5.10C Worker from verified chunks'
          git push origin HEAD:sync/gbr-5.5.10c-20261017
