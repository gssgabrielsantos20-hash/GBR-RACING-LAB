name: GBR Auth - verified session smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - cloud.js
      - tests/auth-session-guard.test.js
      - .github/workflows/auth-session-guard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gbr-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax
        run: |
          node --check cloud.js
          node --check tests/auth-session-guard.test.js
      - name: Regression - verified bootstrap identity
        run: node tests/auth-session-guard.test.js
      - name: Regression - saved favorites
        run: |
          node tests/favorites-model.test.js
          node tests/favorites-spotlight-six.test.js
