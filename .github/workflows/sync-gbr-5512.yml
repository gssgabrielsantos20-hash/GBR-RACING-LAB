name: Sync verified GBR Racing Lab 5.5.12
on:
  push:
    branches:
      - sync/gbr-5.5.12-20261017
    paths:
      - '.github/workflows/sync-gbr-5512.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch exact published runtime and verify original Worker contents
        env:
          GBR_RELEASE_URL: https://bbfa335c.gbr-racing-lab.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          old_worker=Path('_worker.js').read_text(encoding='utf-8')
          tick=chr(96)
          m=re.search('const compressed = '+tick+r'\s*(.*?)\s*'+tick+';',old_worker,re.S)
          if not m:
              raise SystemExit('Base Worker invalid')
          old_payload=gzip.decompress(base64.b64decode(re.sub(r'\s','',m.group(1))))
          old_assets=json.loads(old_payload)
          additions={
              '/assets/telemetry/hero-racer.webp',
              '/assets/telemetry/hero-sidecar.webp',
              '/assets/telemetry/team-blue.webp',
              '/assets/telemetry/team-cyan.webp',
              '/assets/telemetry/team-orange.webp',
              '/assets/telemetry/team-red.webp',
              '/dashboard-telemetry.css',
              '/dashboard-telemetry.js',
              '/setup-print-import.js',
              '/setup-print-parser.js',
              '/setup-print-ui.css',
              '/telemetry-theme.css',
              '/ui-compact-5512.css',
          }
          paths=sorted(set(old_assets)|additions)
          if len(paths)!=72:
              raise SystemExit(f'Unexpected public route count: {len(paths)}')
          root=os.environ['GBR_RELEASE_URL']
          assets={}
          for name in paths:
              rel=name.lstrip('/')
              url=root + urllib.parse.quote(name, safe='/')
              request=urllib.request.Request(url,headers={'User-Agent':'GBR-Release-Sync/5.5.12','Accept':'*/*'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  if response.status!=200:
                      raise SystemExit(f'HTTP {response.status}: {rel}')
                  payload=response.read()
              expected_type=old_assets[name]['t'] if name in old_assets else {
                  '.webp':'image/webp','.js':'application/javascript','.css':'text/css'
              }.get(Path(rel).suffix)
              if not expected_type:
                  raise SystemExit(f'Missing media type: {rel}')
              Path(rel).parent.mkdir(parents=True,exist_ok=True)
              Path(rel).write_bytes(payload)
              assets[name]={'b':base64.b64encode(payload).decode('ascii'),'t':expected_type}
              print(f'OK {rel}: {len(payload)} bytes')

          data=json.dumps(assets,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          actual=hashlib.sha256(data).hexdigest()
          expected='a2c94bfe1b1737a8e94ad8bfa245429b764f644fabb5e1e96bf27e5d41fc2426'
          if actual!=expected:
              raise SystemExit(f'ABORT: Site published content differs from approved 5.5.12 ZIP: {actual}')

          compressed=gzip.compress(data,compresslevel=9,mtime=0)
          encoded=base64.b64encode(compressed).decode('ascii')
          wrapped='\n'.join(encoded[i:i+100] for i in range(0,len(encoded),100))
          header='// GBR Racing Lab 5.5.12 — Importar setup por print; Worker com allowlist\nconst compressed = '+tick+'\n'
          suffix=old_worker.split(tick+';',1)[1]
          worker=(header+wrapped+'\n'+tick+';'+suffix).encode('utf-8')
          workerhash=hashlib.sha256(worker).hexdigest()
          targethash='8a9c617d8299b6c51c221a63bed3fd180405521557eb7b5cfb9f6d936c7f3f0a'
          if workerhash!=targethash:
              raise SystemExit(f'ABORT: Worker hash differs from approved ZIP: {workerhash}')
          Path('_worker.js').write_bytes(worker)
          print(f'APPROVED: Worker SHA256 {workerhash}; {len(paths)} public paths')
          PYCODE
      - name: Commit validated source and Worker on staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- _worker.js index.html app.js cloud.js favorites.js garage-plus.js dashboard-telemetry.js dashboard-telemetry.css setup-print-import.js setup-print-parser.js setup-print-ui.css telemetry-theme.css ui-compact-5512.css assets/telemetry
          if git diff --cached --quiet; then
            echo "Source already synced"
          else
            git commit -m "chore(sync): restore verified GBR Racing Lab 5.5.12 production runtime"
            git push origin HEAD:sync/gbr-5.5.12-20261017
          fi
